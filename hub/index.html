<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Desktop glance: read-only, built from cal.ics. Ticking happens in the private hub. Always dark, so the night-ocean scene reads well. */
:root{
  --bg:#05080F; --tile:rgba(10,15,27,.42); --tile2:rgba(255,255,255,.06); --line:rgba(255,255,255,.09);
  --ink:#E9EDF3; --muted:#9AA4B4; --accent:#9CC9EA; --amber:#E3B47C; --lav:#AEA8E8; --leaf:#86D2AE; --teal:#7CCBCB;
  --glass:blur(28px) saturate(1.15); --shadow:0 12px 32px rgba(0,0,0,.25); --r:18px;
  --f-head:"Outfit","Avenir Next",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));cursor:pointer}
#scene{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-head);font-weight:400;line-height:1.2}
h1{font-size:clamp(2rem,5.5vw,2.75rem);letter-spacing:-.02em;line-height:1.1}
.label{font-family:var(--f-head);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .small{font-size:.84rem}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 4px}
.logo{font-family:var(--f-head);font-weight:500;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:block}
.still{font:inherit;font-family:var(--f-head);font-size:.74rem;min-height:32px;padding:4px 11px;border-radius:999px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--muted);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.still[aria-pressed="true"]{color:var(--ink)}
header{padding:28px 0 18px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);display:flex;flex-direction:column;gap:10px;min-width:0}
.big{font-family:var(--f-head);font-size:1.55rem;line-height:1.25;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-flex;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tile2);white-space:nowrap}
.chip.soon{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.chip.ok{color:var(--leaf);background:color-mix(in srgb,var(--leaf) 14%,transparent)}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it span:first-child{min-width:0}
.blk{--k:var(--leaf);display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.blk time{font-family:var(--f-head);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk div{border-radius:14px;padding:8px 12px;background:color-mix(in srgb,var(--k) 16%,var(--tile));border:1px solid color-mix(in srgb,var(--k) 28%,transparent)}
.blk.past{opacity:.5}
.blk.health{--k:var(--teal)} .blk.study{--k:var(--lav)} .blk.uni{--k:var(--accent)} .blk.money{--k:var(--amber)}
.now{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.now span{font-family:var(--f-head);font-size:.78rem;color:var(--amber);font-variant-numeric:tabular-nums}
.now i{height:2px;background:var(--amber);border-radius:2px;display:block}
.day{display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="bar"><span class="logo"><i></i>Hub</span><button class="still" id="still-btn" aria-pressed="false" aria-label="Keep the background still">Still</button></div>
  <header><p class="label" id="date"></p><h1 id="hello">Hello</h1><p class="muted">Tap anything to open your hub and tick it off there.</p></header>
  <div class="grid">
    <div class="col">
      <div class="tile" id="next"><p class="label">Next deadline</p><p class="big muted">Loading…</p></div>
      <div class="tile"><p class="label">Life, next two weeks</p><div class="list" id="life"></div></div>
      <div class="tile"><p class="label">Coming up</p><div class="list" id="soon"></div></div>
    </div>
    <div class="tile"><div class="row"><h3>Your day</h3></div><div class="day" id="day"></div></div>
  </div>
</div>

<script>
const HUB = 'https://claude.ai/artifact/92XhcSqidWhnN4hDrJzCrU';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const daysUntil = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(new Date().toDateString())) / 864e5);
const when = d => { const n = daysUntil(d); return n < 0 ? 'passed' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : n <= 6 ? `in ${n} days` : d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}); };
const chip = d => `<span class="chip ${daysUntil(d) <= 3 ? 'soon' : ''}">${when(d)}</span>`;
const hm = m => pad(Math.floor(m/60)) + ':' + pad(m % 60);

// Read cal.ics: UTC times end in Z, study blocks are local ("floating"), bills are all-day dates.
function parseIcs(text){
  return text.replace(/\r?\n[ \t]/g, '').split('BEGIN:VEVENT').slice(1).map(b => {
    const get = k => ((b.match(new RegExp('^' + k + '[^:\\r\\n]*:(.*)$', 'm')) || [])[1] || '').trim();
    const v = get('DTSTART'), [y, mo, d, h, mi] = [v.slice(0,4), v.slice(4,6), v.slice(6,8), v.slice(9,11), v.slice(11,13)].map(Number);
    const start = v.length === 8 ? new Date(y, mo-1, d) : v.endsWith('Z') ? new Date(Date.UTC(y, mo-1, d, h, mi)) : new Date(y, mo-1, d, h, mi);
    return {summary: get('SUMMARY'), start, allDay: v.length === 8};
  }).filter(e => e.summary && !isNaN(e.start));
}

let EV = [];
async function load(){
  try{ const r = await fetch('../cal.ics', {cache:'no-store'}); if(r.ok){ EV = parseIcs(await r.text()); render(); } }
  catch(e){ console.warn(e); }
}

function render(){
  const now = new Date(), h = now.getHours(), today = dayKey(now);
  $('#date').textContent = now.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
  $('#hello').textContent = h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';

  const due = EV.filter(e => e.summary.startsWith('Due: ') && daysUntil(e.start) >= 0).sort((a, b) => a.start - b.start)
    .map(e => ({...e, title: e.summary.slice(5)}));
  const next = due[0];
  $('#next').innerHTML = `<p class="label">Next deadline</p>` + (next
    ? `<p class="big">${esc(next.title)}</p><div class="row"><span class="muted small">${next.start.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'})}</span><span class="chip ${daysUntil(next.start) <= 3 ? 'soon' : ''}">${daysUntil(next.start) <= 1 ? when(next.start) : daysUntil(next.start) + ' days to go'}</span></div>`
    : `<p class="big muted">Nothing due. Nice.</p>`);
  $('#soon').innerHTML = due.slice(1, 6).map(e => `<div class="it"><span>${esc(e.title)}</span>${chip(e.start)}</div>`).join('') || `<p class="small muted">Nothing else on the way.</p>`;

  const life = EV.filter(e => e.allDay && daysUntil(e.start) >= 0 && daysUntil(e.start) <= 14);
  $('#life').innerHTML = life.map(e => `<div class="it"><span>${esc(e.summary)}</span>${chip(e.start)}</div>`).join('') || `<p class="small muted">Nothing due in the next two weeks.</p>`;

  const weekend = now.getDay() === 0 || now.getDay() === 6;
  const B = [
    {at: 8*60, title: 'Wake up, water, breakfast'},
    {at: 9*60, title: 'Gym', kind: 'health'},
    {at: 11*60, title: 'Meds (if you’re taking them today)', kind: 'health'},
    {at: 13*60, title: 'Lunch and a walk'},
  ];
  EV.filter(e => !e.allDay && dayKey(e.start) === today).forEach(e => {
    const m = e.start.getHours()*60 + e.start.getMinutes();
    if(e.summary === 'Study block') B.push({at: m, title: 'Study block: open the hub, do the step under Up next', kind: 'study'});
    else if(e.summary.startsWith('Due: ')) B.push({at: m + 60, title: e.summary, kind: 'uni'});
  });
  life.filter(e => dayKey(e.start) === today).forEach(e => B.push({at: 9*60 + 30, title: e.summary, kind: 'money'}));
  if(weekend) B.push({at: 14*60, title: 'Rest day. One small step if you fancy it'});
  B.sort((a, b) => a.at - b.at);
  const nowM = h*60 + now.getMinutes();
  let html = '', placed = false;
  B.forEach(b => {
    if(!placed && b.at > nowM){ html += `<div class="now"><span>${hm(nowM)}</span><i></i></div>`; placed = true; }
    html += `<div class="blk ${b.kind || ''} ${b.at + 30 < nowM ? 'past' : ''}"><time>${hm(b.at)}</time><div>${esc(b.title)}</div></div>`;
  });
  if(!placed) html += `<div class="now"><span>${hm(nowM)}</span><i></i></div>`;
  $('#day').innerHTML = html;
}

document.addEventListener('click', e => {
  if(e.target.closest('#still-btn')) return;
  window.open(HUB, '_blank', 'noopener');
});
render(); load();
setInterval(load, 3*60*60*1000);                                  // pick up the morning sync
setInterval(() => { if(!document.hidden) render(); }, 5*60*1000); // keep the greeting and the now line current
</script>
<script>
/* ---------- live background: moonlit night ocean ---------- */
(function(){
  const c = document.getElementById('scene'); if(!c) return;
  const x = c.getContext('2d');
  const rm = matchMedia('(prefers-reduced-motion: reduce)');
  let still = false; try{ still = localStorage.getItem('hub-still')==='1'; }catch(e){}
  const btn = document.getElementById('still-btn');
  const sync = () => { if(btn) btn.setAttribute('aria-pressed', still); };
  if(btn) btn.addEventListener('click', () => { still = !still; try{ localStorage.setItem('hub-still', still?'1':'0'); }catch(e){} sync(); });
  sync();
  let w=0, h=0, d=1, base=null, t=Math.random()*60, mx=.5, tmx=.5, last=0, drawn=false;
  addEventListener('pointermove', e => { tmx = e.clientX/innerWidth; }, {passive:true});
  const HZ = .56, MX = .74, MY = .2;                    // horizon height, moon position
  function resize(){
    d = Math.min(devicePixelRatio||1, 1.5); w = Math.round(innerWidth*d); h = Math.round(innerHeight*d); c.width = w; c.height = h;
    base = document.createElement('canvas'); base.width = w; base.height = h; const b = base.getContext('2d'), H = h*HZ;
    const sky = b.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#04060d'); sky.addColorStop(.6,'#0a1226'); sky.addColorStop(1,'#16223f');
    b.fillStyle = sky; b.fillRect(0,0,w,H+1);
    for(let i=0, n=Math.round(innerWidth*innerHeight/7000); i<n; i++){ const y = Math.pow(Math.random(),1.4)*H*.9;
      b.fillStyle = `rgba(225,232,250,${(.1+Math.random()*.45)*(1-y/H)})`; b.beginPath(); b.arc(Math.random()*w, y, (Math.random()<.1?1.1:.6)*d, 0, 7); b.fill(); }
    const mx0 = w*MX, my0 = h*MY, mr = Math.max(10*d, Math.min(w,h)*.035);
    const glow = b.createRadialGradient(mx0,my0,mr*.8,mx0,my0,mr*9); glow.addColorStop(0,'rgba(220,230,255,.22)'); glow.addColorStop(1,'rgba(220,230,255,0)');
    b.fillStyle = glow; b.fillRect(0,0,w,H);
    const disc = b.createRadialGradient(mx0-mr*.3,my0-mr*.3,0,mx0,my0,mr); disc.addColorStop(0,'#fbf8ee'); disc.addColorStop(1,'#d9dccf');
    b.fillStyle = disc; b.beginPath(); b.arc(mx0,my0,mr,0,7); b.fill();
    const hg = b.createLinearGradient(0,H-h*.05,0,H+h*.04); hg.addColorStop(0,'rgba(120,150,210,0)'); hg.addColorStop(.5,'rgba(120,150,210,.12)'); hg.addColorStop(1,'rgba(120,150,210,0)');
    b.fillStyle = hg; b.fillRect(0,H-h*.05,w,h*.09);
    const sea = b.createLinearGradient(0,H,0,h); sea.addColorStop(0,'#111b34'); sea.addColorStop(.4,'#0a1226'); sea.addColorStop(1,'#04070f');
    b.fillStyle = sea; b.fillRect(0,H,w,h-H);
    drawn = false;
  }
  function frame(dt){
    mx += (tmx-mx)*.02; t += dt;
    const H = h*HZ, N = 34, cx = w*MX + (mx-.5)*w*.02;
    x.drawImage(base,0,0);
    for(let r=0;r<N;r++){
      const k = r/N, y = H + Math.pow(k,1.8)*(h-H)*1.02 + 2*d;
      const amp = (1 + k*7)*d, freq = .012/d*(1 - k*.6), sp = .35 + k*.5;
      x.strokeStyle = `rgba(150,175,225,${.05 + k*.07})`; x.lineWidth = (.6 + k*1.4)*d;
      x.beginPath();
      for(let i=0;i<=w;i+=8*d){ const yy = y + Math.sin(i*freq + t*sp + r*1.7)*amp + Math.sin(i*freq*2.3 - t*sp*.7 + r)*amp*.35; i ? x.lineTo(i,yy) : x.moveTo(i,yy); }
      x.stroke();
      // the moon's path on the water: short bright dashes that shimmer
      const spread = w*(.012 + k*.07), dashes = 2 + Math.round(k*5);
      for(let j=0;j<dashes;j++){
        const off = Math.sin(t*(.9+j*.13) + r*2.1 + j*1.7)*spread, len = spread*(.25 + .35*Math.abs(Math.sin(t*.6 + r + j)));
        const a = (.38 - k*.22) * (.45 + .55*Math.abs(Math.sin(t*1.4 + r*1.3 + j)));
        const yy = y + Math.sin(cx*freq + t*sp + r*1.7)*amp;
        x.strokeStyle = `rgba(235,238,245,${a*.8})`; x.lineWidth = (1 + k*1.6)*d; x.lineCap = 'round';
        x.beginPath(); x.moveTo(cx + off - len/2, yy); x.lineTo(cx + off + len/2, yy); x.stroke();
      }
    }
  }
  function loop(now){
    requestAnimationFrame(loop);
    if(document.hidden) return;
    const quiet = still || rm.matches;
    if(quiet && drawn) return;
    if(now - last < 40 && drawn) return;               // 25 frames a second is plenty for slow waves
    const dt = drawn && !quiet ? Math.min(.15, (now-last)/1000) : 0; last = now;
    frame(dt); drawn = true;
  }
  addEventListener('resize', resize); resize(); requestAnimationFrame(loop);
})();
</script>
</body></html>
